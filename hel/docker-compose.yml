services:
  db:
    image: postgres:16-alpine 
    container_name: ecommerce-db 
    restart: always 
    environment:
      MYSQL_ROOT_PASSWORD: root 
      MYSQL_DATABASE: invoice_db
    ports:
      - "3307:3306" 
    volumes:
      - mysql_data:/var/lib/mysql 
      - ./backend/db:/docker-entrypoint-initdb.d 
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 5s 
      timeout: 10s 
      retries: 10
      start_period: 30s 

  backend:
    build: ./backend 
    ports: 
      - "5001:5000"
    env_file:
      - "./backend/.env"
    environment:
      - MYSQL_HOST=mysql 
      - GROQ_MODEL=llama 
      
    
